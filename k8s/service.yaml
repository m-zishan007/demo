apiVersion: v1
kind: Service
metadata:
  name: springboot-service
spec:
  selector:
    app: springboot-demo
  ports:
    - protocol: TCP
      port: 80         # The port inside the cluster
      targetPort: 8080 # The port your Spring Boot app listens on
      nodePort: 32000  # You can access it at http://192.168.1.113:32000
  type: NodePort