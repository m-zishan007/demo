spring.application.name=demo
# Database URL (Format: jdbc:postgresql://host:port/database_name)
spring.datasource.url=jdbc:postgresql://192.168.1.81:5432/dev-db

spring.datasource.username=admin
spring.datasource.password=your_secure_password

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=my-demo-app
management.metrics.export.prometheus.enabled=true

management.metrics.web.server.request.autotime.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Change the Swagger UI path (Default is /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui
# Change the OpenAPI description path (Default is /v3/api-docs)
springdoc.api-docs.path=/api-docs